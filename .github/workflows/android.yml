name: Android preview
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
      - name: Fetch pinned native runtime
        run: android/scripts/bootstrap-native.sh
      - name: Build and test
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paladino-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/core/build/test-results/**
            android/app/build/test-results/**
            android/app/build/reports/lint-results-debug.html
