name: Android preview
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Fetch pinned native runtime
        run: android/scripts/bootstrap-native.sh
      - name: Fetch pinned security engine
        run: android/scripts/bootstrap-security.sh
      - name: Test release evidence verifier
        working-directory: android
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build and test
        working-directory: android
        run: ./gradlew :core:test :security-core:test :security-scanner:test :security-benchmark:test :security-benchmark:benchmarkSmoke :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assemblePlayRelease :app:bundlePlayRelease -PpaladinoAbi=arm64-v8a
      - name: Verify distribution permissions
        run: |
          direct=android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          play=android/app/build/intermediates/merged_manifest/playRelease/processPlayReleaseMainManifest/AndroidManifest.xml
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$direct"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$play"
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$direct"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$play"; then
            echo 'Play release must not request package installation.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: paladino-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/core/build/test-results/**
            android/security-core/build/test-results/**
            android/security-scanner/build/test-results/**
            android/security-benchmark/build/test-results/**
            android/security-benchmark/build/reports/security-benchmark/**
            android/app/build/test-results/**
            android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: paladino-unsigned-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/**
      - uses: actions/upload-artifact@v4
        with:
          name: paladino-unsigned-play-release
          path: |
            android/app/build/outputs/apk/playRelease/*.apk
            android/app/build/outputs/bundle/playRelease/*.aab
            android/app/build/outputs/mapping/playRelease/**
