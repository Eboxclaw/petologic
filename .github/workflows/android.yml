name: Android preview
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # android-actions/setup-android@v3 is broken upstream: it installs the legacy 'tools'
      # package that Google removed from the SDK repository. Runner images ship cmdline-tools
      # but (newer images) no longer expose sdkmanager on PATH; resolve it and bootstrap the
      # official command-line tools when the image lacks them, then accept all licenses.
      - name: Prepare Android SDK tooling
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMAN="$(ls "$ANDROID_SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$SDKMAN" ]; then
            echo "sdkmanager not found; installing Google command-line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_SDK/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK/cmdline-tools"
            mv "$ANDROID_SDK/cmdline-tools/cmdline-tools" "$ANDROID_SDK/cmdline-tools/latest"
            SDKMAN="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMAN"
          echo "SDKMAN=$SDKMAN" >> "$GITHUB_ENV"
          yes | "$SDKMAN" --licenses > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          "$SDKMAN" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null
      - name: Fetch pinned native runtime
        run: android/scripts/bootstrap-native.sh
      - name: Fetch pinned security engine
        run: android/scripts/bootstrap-security.sh
      - name: Test release evidence verifier
        working-directory: android
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build and test
        working-directory: android
        run: ./gradlew :core:test :security-core:test :security-scanner:test :security-benchmark:test :security-benchmark:benchmarkSmoke :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assemblePlayRelease :app:bundlePlayRelease -PpaladinoAbi=arm64-v8a
      - name: Verify distribution permissions
        run: |
          direct=android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          play=android/app/build/intermediates/merged_manifest/playRelease/processPlayReleaseMainManifest/AndroidManifest.xml
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$direct"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$play"
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$direct"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$play"; then
            echo 'Play release must not request package installation.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: paladino-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/core/build/test-results/**
            android/security-core/build/test-results/**
            android/security-scanner/build/test-results/**
            android/security-benchmark/build/test-results/**
            android/security-benchmark/build/reports/security-benchmark/**
            android/app/build/test-results/**
            android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: paladino-unsigned-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/**
      - uses: actions/upload-artifact@v4
        with:
          name: paladino-unsigned-play-release
          path: |
            android/app/build/outputs/apk/playRelease/*.apk
            android/app/build/outputs/bundle/playRelease/*.aab
            android/app/build/outputs/mapping/playRelease/**
